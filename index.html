<!doctype html>
<html lang="en" class="sidebar-dark">
 <head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/RNBD.png" />
  <link rel="shortcut icon" href="/RNBD.png" />
  <link rel="apple-touch-icon" href="/RNBD.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
   name="description"
   content="RNB Dashboard — Roads and Buildings Department, Gujarat" />
  <title>RNB Dashboard</title>
  <script>
   // Resolve the theme before first paint. Default is light unless the user chose dark.
   (function () {
    var theme = 'light';
    try {
     var saved = localStorage.getItem('rnb_theme');
     if (saved === 'light' || saved === 'dark') theme = saved;
    } catch (err) {
     /* private mode / blocked storage — fall back to light */
    }
    document.documentElement.setAttribute('data-theme', theme);
    document.documentElement.style.colorScheme = theme;
   })();
  </script>
 </head>
 <body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
 </body>
</html>
